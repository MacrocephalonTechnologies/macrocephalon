  <circle cx="350" cy="220" r="18" fill="#0f1428" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="350" cy="310" r="18" fill="#0f1428" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="350" cy="400" r="18" fill="#0f1428" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="350" cy="490" r="18" fill="#0f1428" stroke="#8b5cf6" stroke-width="2"/>
