  <text x="440" y="305" font-family="monospace" font-size="8" fill="#22d3ee" text-anchor="middle">ŷ</text>
  <circle cx="440" cy="400" r="20" fill="#0f2030" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="440" y="405" font-family="monospace" font-size="8" fill="#22d3ee" text-anchor="middle">ŷ</text>
