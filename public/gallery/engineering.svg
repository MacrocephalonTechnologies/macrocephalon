<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="whitebench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ecef"/>
      <stop offset="100%" stop-color="#d0d4d8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- White workbench surface (like real photo) -->
  <rect x="0" y="380" width="1200" height="370" fill="url(#whitebench)" opacity="0.95"/>
  <!-- Bench shadow at top -->
  <rect x="0" y="380" width="1200" height="20" fill="#c0c4c8" opacity="0.5"/>

  <!-- === ROBOT / HEXAPOD on left side === -->
  <!-- Body platform - PCB style -->
  <rect x="80" y="220" width="260" height="160" rx="8" fill="#1a3a1a" stroke="#2a5a2a" stroke-width="2" filter="url(#shadow)"/>
  <!-- PCB texture -->
  <rect x="90" y="230" width="240" height="140" rx="4" fill="#122012"/>
  <!-- Chips on body -->
  <rect x="140" y="255" width="50" height="40" rx="2" fill="#111120" stroke="#222240" stroke-width="1"/>
  <text x="165" y="278" font-family="monospace" font-size="8" fill="#3a5a78" text-anchor="middle">ATmega</text>
  <rect x="220" y="260" width="40" height="30" rx="2" fill="#111120" stroke="#222240" stroke-width="1"/>
  <text x="240" y="277" font-family="monospace" font-size="7" fill="#3a5a78" text-anchor="middle">L298</text>
  <!-- Mounting holes -->
  <circle cx="100" cy="240" r="6" fill="#0a1208" stroke="#2a4a2a" stroke-width="1"/>
  <circle cx="330" cy="240" r="6" fill="#0a1208" stroke="#2a4a2a" stroke-width="1"/>
  <circle cx="100" cy="360" r="6" fill="#0a1208" stroke="#2a4a2a" stroke-width="1"/>
  <circle cx="330" cy="360" r="6" fill="#0a1208" stroke="#2a4a2a" stroke-width="1"/>
  <!-- PCB traces -->
  <g stroke="#8b6914" stroke-width="1.2" fill="none" opacity="0.5">
    <line x1="190" y1="255" x2="190" y2="230"/>
    <line x1="190" y1="230" x2="300" y2="230"/>
    <line x1="260" y1="290" x2="310" y2="290"/>
    <line x1="140" y1="310" x2="100" y2="310"/>
    <line x1="100" y1="310" x2="100" y2="350"/>
  </g>

  <!-- Robot legs (6 legs like hexapod) -->
  <!-- Front left -->
  <line x1="100" y1="270" x2="55" y2="230" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="230" x2="25" y2="265" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="25" y1="265" x2="15" y2="310" stroke="#777" stroke-width="4" stroke-linecap="round"/>
  <!-- Middle left -->
  <line x1="100" y1="300" x2="50" y2="290" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="290" x2="20" y2="320" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="320" x2="10" y2="370" stroke="#777" stroke-width="4" stroke-linecap="round"/>
  <!-- Rear left -->
  <line x1="100" y1="340" x2="55" y2="360" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="360" x2="30" y2="395" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="395" x2="25" y2="440" stroke="#777" stroke-width="4" stroke-linecap="round"/>
  <!-- Front right -->
  <line x1="330" y1="270" x2="375" y2="230" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="375" y1="230" x2="405" y2="265" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="405" y1="265" x2="415" y2="310" stroke="#777" stroke-width="4" stroke-linecap="round"/>
  <!-- Middle right -->
  <line x1="330" y1="300" x2="380" y2="290" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="290" x2="410" y2="315" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="410" y1="315" x2="420" y2="360" stroke="#777" stroke-width="4" stroke-linecap="round"/>
  <!-- Rear right -->
  <line x1="330" y1="340" x2="375" y2="365" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="375" y1="365" x2="400" y2="400" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="400" y1="400" x2="405" y2="445" stroke="#777" stroke-width="4" stroke-linecap="round"/>

  <!-- Servo motors on legs -->
  <rect x="55" y="222" width="20" height="14" rx="2" fill="#555" stroke="#333" stroke-width="1"/>
  <rect x="50" y="282" width="20" height="14" rx="2" fill="#555" stroke="#333" stroke-width="1"/>
  <rect x="365" y="222" width="20" height="14" rx="2" fill="#555" stroke="#333" stroke-width="1"/>

  <!-- Wires on robot -->
  <path d="M 165 295 Q 165 210 210 200 Q 230 196 250 200" fill="none" stroke="#ff4422" stroke-width="2.5"/>
  <path d="M 200 295 Q 200 215 230 205" fill="none" stroke="#f5c518" stroke-width="2"/>
  <!-- Robot label -->
  <text x="210" y="410" font-family="Arial" font-size="12" fill="#6b7280" text-anchor="middle">Hexapod Robot — Servo Control</text>

  <!-- SEPARATOR line on workbench -->
  <line x1="470" y1="385" x2="470" y2="740" stroke="#b0b4b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right side - workbench with PCB + multimeter -->
  <!-- White background area -->
  <rect x="480" y="385" width="700" height="360" fill="#e8ecef" rx="0"/>

  <!-- PCB Board on bench -->
  <rect x="510" y="420" width="340" height="220" rx="6" fill="#c8001a" stroke="#a00015" stroke-width="2" filter="url(#shadow)"/>
  <!-- PCB silkscreen white -->
  <rect x="525" y="435" width="310" height="190" rx="4" fill="#b8001a"/>
  <!-- Main DIP chip -->
  <rect x="610" y="460" width="80" height="110" rx="2" fill="#111" stroke="#333" stroke-width="1"/>
  <!-- Chip pins left -->
  <g fill="#c8960a">
    <rect x="600" y="470" width="10" height="5"/>
    <rect x="600" y="480" width="10" height="5"/>
    <rect x="600" y="490" width="10" height="5"/>
    <rect x="600" y="500" width="10" height="5"/>
    <rect x="600" y="510" width="10" height="5"/>
    <rect x="600" y="520" width="10" height="5"/>
    <rect x="600" y="530" width="10" height="5"/>
    <rect x="600" y="540" width="10" height="5"/>
    <rect x="600" y="550" width="10" height="5"/>
    <!-- right pins -->
    <rect x="690" y="470" width="10" height="5"/>
    <rect x="690" y="480" width="10" height="5"/>
    <rect x="690" y="490" width="10" height="5"/>
    <rect x="690" y="500" width="10" height="5"/>
    <rect x="690" y="510" width="10" height="5"/>
    <rect x="690" y="520" width="10" height="5"/>
    <rect x="690" y="530" width="10" height="5"/>
    <rect x="690" y="540" width="10" height="5"/>
    <rect x="690" y="550" width="10" height="5"/>
  </g>
  <text x="650" y="518" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">PIC16F</text>
  <text x="650" y="530" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">877A</text>

  <!-- LED on PCB -->
  <circle cx="560" cy="490" r="7" fill="#ff2200"/>
  <circle cx="560" cy="490" r="10" fill="#ff2200" opacity="0.25"/>
  <!-- USB port -->
  <rect x="530" y="590" width="28" height="20" rx="2" fill="#2a3a5a" stroke="#1a2a4a" stroke-width="1"/>
  <!-- Headers -->
  <g fill="#c8960a">
    <rect x="740" y="445" width="6" height="35"/>
    <rect x="750" y="445" width="6" height="35"/>
    <rect x="760" y="445" width="6" height="35"/>
    <rect x="770" y="445" width="6" height="35"/>
    <rect x="780" y="445" width="6" height="35"/>
  </g>
  <!-- PCB traces -->
  <g stroke="#e8c870" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="560" y1="500" x2="610" y2="500"/>
    <line x1="690" y1="490" x2="740" y2="490"/>
    <line x1="558" y1="590" x2="558" y2="560"/>
    <line x1="558" y1="560" x2="600" y2="560"/>
    <line x1="690" y1="540" x2="740" y2="540"/>
  </g>
  <text x="545" y="435" font-family="monospace" font-size="9" fill="#e8c870">MicroChip dsPIC</text>
  <text x="545" y="448" font-family="monospace" font-size="8" fill="#c8a850">Rev 1.0</text>

  <!-- Multimeter -->
  <rect x="880" y="410" width="160" height="270" rx="10" fill="#222" stroke="#111" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="425" width="130" height="70" rx="4" fill="#001a00"/>
  <!-- Display reading -->
  <text x="960" y="450" font-family="monospace" font-size="20" font-weight="bold" fill="#00ff44" text-anchor="middle">3.314</text>
  <text x="960" y="472" font-family="monospace" font-size="11" fill="#00cc33" text-anchor="middle">DC Voltage V</text>
  <text x="960" y="488" font-family="monospace" font-size="9" fill="#006622" text-anchor="middle">AUTO RANGE</text>
  <!-- Range knob -->
  <circle cx="960" cy="560" r="28" fill="#333" stroke="#111" stroke-width="2"/>
  <circle cx="960" cy="540" r="5" fill="#cc1100"/>
  <text x="960" y="563" font-family="Arial" font-size="8" fill="#aaa" text-anchor="middle">DCV</text>
  <!-- Probes -->
  <line x1="920" y1="680" x2="820" y2="730" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <line x1="930" y1="680" x2="850" y2="740" stroke="#dd2200" stroke-width="4" stroke-linecap="round"/>
  <circle cx="820" cy="731" r="5" fill="#111"/>
  <circle cx="850" cy="741" r="5" fill="#cc1100"/>

  <!-- Test probe touching PCB -->
  <line x1="820" y1="731" x2="735" y2="580" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="735" cy="580" r="4" fill="#333"/>

  <!-- Hands silhouette (simplified) -->
  <ellipse cx="770" cy="700" rx="55" ry="30" fill="#c8a882" opacity="0.8"/>
  <ellipse cx="860" cy="715" rx="50" ry="25" fill="#c8a882" opacity="0.8"/>
  <!-- Fingers -->
  <ellipse cx="735" cy="690" rx="12" ry="28" fill="#c8a882" opacity="0.8" transform="rotate(-20, 735, 690)"/>
  <ellipse cx="750" cy="685" rx="11" ry="30" fill="#c0a07a" opacity="0.8" transform="rotate(-15, 750, 685)"/>

  <!-- Labels -->
  <text x="680" y="670" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">PCB Testing — Voltage Measurement</text>

  <!-- Top caption -->
  <text x="210" y="175" font-family="Arial" font-size="16" font-weight="bold" fill="#60a5fa">Hexapod Walking Robot</text>
  <text x="210" y="198" font-family="Arial" font-size="12" fill="#4a5568">12× SG90 Servos · Arduino Mega · Custom PCB</text>
</svg>
